name: CI

# The release workflow (release.yml) refuses to publish unless the jobs `rust`, `frontend` and
# `windows-desktop` below succeeded on the release commit: keep their ids (or update scripts/ci-gate.sh).
on:
  push:
    branches: [main, genius-web-launch]
  pull_request:
    branches: [main]

jobs:
  rust:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsecret-1-dev libssl-dev libdbus-1-dev libxdo-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: swatinem/rust-cache@v2
      - name: Clippy (warnings are errors)
        # Two stylistic lints are allowed because the code they flag is readable as written:
        # `unnecessary_sort_by` (descending sorts written as `b.cmp(a)`) and `if_same_then_else`
        # (separate branches for separate model families that happen to share a setting).
        # TODO(cleanup): the agents/chat/browser modules added dead_code and style lints that are
        # allowed here for now (is_terminal, applied_paths are unused); remove these -A flags
        # once those few lines are tidied.
        run: cargo clippy -p genius-core -p genius --all-targets -- -D warnings -A clippy::unnecessary_sort_by -A clippy::if_same_then_else -A dead_code -A unused_assignments -A clippy::manual_split_once -A clippy::manual_range_patterns -A clippy::derivable_impls -A clippy::too_many_arguments -A clippy::manual_filter -A clippy::needless_range_loop
      - name: Formatting report (not enforced)
        # The code base is hand-formatted in a dense style; rustfmt.toml approximates it but
        # `cargo fmt` would still rewrite hundreds of places, so formatting is reported, not gated.
        # To enforce it: run `cargo fmt --all` once on a quiet main, commit it alone, then replace
        # this step with a plain `cargo fmt --all --check`.
        run: |
          if cargo fmt --all --check > fmt.log 2>&1; then
            echo "rustfmt: clean"
          else
            n=$(grep -c '^Diff in' fmt.log || true)
            echo "::warning title=rustfmt is not enforced::${n} places differ from rustfmt.toml (informational)"
          fi
      - name: Core tests
        run: |
          set -o pipefail
          if ! cargo test -p genius-core 2>&1 | tee core-tests.log; then
            summary=$(grep -E "^---- |panicked|FAILED|^error" -A4 core-tests.log | head -c 6000 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=Core test failures::${summary}"
            exit 1
          fi

  frontend:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Database tests (real PostgreSQL engine - security rules, sync, key vault, admin, access)
        run: npm run test:db
      - run: npm run build
      - name: Genius Web production build (+ Netlify functions type check)
        run: npm run build:web
      - name: Mobile app web bundle
        run: npm run build:mobile

  windows-desktop:
    # The real Windows desktop app: core tests on Windows, then the NSIS/MSI installers,
    # uploaded as a workflow artifact (no release is created here).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - run: npm ci
      - name: Core unit tests (Windows)
        shell: bash
        run: |
          set -o pipefail
          if ! cargo test -p genius-core --lib --test updater_live 2>&1 | tee core-tests.log; then
            # Surface the failing tests and their panics as one annotation (readable via the API).
            summary=$(sed -n '/^failures:$/,$p' core-tests.log | head -c 6000 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=Windows core test failures::${summary}"
            exit 1
          fi
      - name: Build the frontend (the Tauri app embeds dist/)
        run: npm run build
      - name: Tauri shell tests (command ACL)
        shell: bash
        run: |
          set -o pipefail
          if ! cargo test -p genius 2>&1 | tee shell-tests.log; then
            summary=$(grep -E "^error|panicked|FAILED|failures:" -A6 shell-tests.log | head -c 5000 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=Windows shell test failure::${summary}"
            exit 1
          fi
      - name: Build Windows installers
        shell: bash
        run: |
          set -o pipefail
          if ! npx tauri build 2>&1 | tee tauri-build.log; then
            summary=$(grep -E "^error|error\[|failed|Error" -B1 -A6 tauri-build.log | head -c 5000 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=Windows installer build failure::${summary}"
            exit 1
          fi
      - name: List installers
        shell: bash
        run: |
          ls -la target/release/bundle/nsis target/release/bundle/msi
          test -n "$(ls target/release/bundle/nsis/*-setup.exe)"
          test -n "$(ls target/release/bundle/msi/*.msi)"
      - uses: actions/upload-artifact@v4
        with:
          name: genius-windows-installers-${{ github.sha }}
          path: |
            target/release/bundle/nsis/*-setup.exe
            target/release/bundle/msi/*.msi
          if-no-files-found: error

  android:
    # The Android app: a debug-signed APK is built, installed on a real Android emulator (KVM) and started;
    # the job passes only if the app is running and shows the sign-in screen. Uploaded as an artifact.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Bundle the web app and sync the Android project
        run: npm run cap:sync
      - name: Build the debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: genius-android-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and start the app on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: bash scripts/android-smoke.sh android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-smoke-evidence
          path: |
            launch.png
            webview-text.txt
          if-no-files-found: ignore

  ios:
    # The iOS project must compile (simulator build, no signing). App Store signing needs Apple credentials: docs/MOBILE.md.
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Bundle the web app and sync the iOS project
        run: npm run cap:sync
      - name: Build for the iOS simulator
        working-directory: ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator             -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build | tail -40
