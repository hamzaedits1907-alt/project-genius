# Genius Web on Netlify. Import this repository (branch: genius-web-launch) with
# "Import an existing project"; Netlify reads everything below, so the dashboard build settings can stay empty.
# The desktop app (Tauri) is NOT built here: it is a separate pipeline (.github/workflows).

[build]
  command = "npm ci && npm run build:web"
  publish = "dist-web"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

# The signed-in app is a single-page app: every /app/... and /admin address serves the app shell.
[[redirects]]
  from = "/app"
  to = "/app/index.html"
  status = 200
[[redirects]]
  from = "/app/*"
  to = "/app/index.html"
  status = 200
[[redirects]]
  from = "/admin"
  to = "/app/index.html"
  status = 200
[[redirects]]
  from = "/admin/*"
  to = "/app/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

[[headers]]
  for = "/app/*"
  [headers.values]
    X-Frame-Options = "DENY"
    Cache-Control = "no-cache"
    # Scripts only from this site; the app talks to Supabase and to the AI providers the user chooses
    # (custom endpoints can be any https address, hence https: for connect-src).
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: wss:; worker-src 'self' blob:; frame-src 'self' about: blob: data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
